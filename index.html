<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>Leon English Lab 4.0</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#f5f5f7;
  --card:rgba(255,255,255,.86);
  --text:#171717;
  --muted:#86868b;
  --blue:#007aff;
  --green:#34c759;
  --red:#ff3b30;
  --line:rgba(0,0,0,.08);
  --shadow:0 12px 35px rgba(0,0,0,.07);
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
  "Helvetica Neue",Arial,sans-serif;
}

body.dark{
  --bg:#111113;
  --card:rgba(31,31,34,.9);
  --text:#f5f5f7;
  --muted:#999;
  --line:rgba(255,255,255,.1);
  --shadow:0 12px 35px rgba(0,0,0,.3);
}

button,input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  width:min(760px,100%);
  margin:auto;
  padding:18px 16px 110px;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:25px;
}

.logo{
  font-size:20px;
  font-weight:800;
}

.icon-btn{
  width:42px;
  height:42px;
  border-radius:50%;
  background:var(--card);
  box-shadow:var(--shadow);
}

.page{
  display:none;
}

.page.active{
  display:block;
}

h1{
  font-size:34px;
  line-height:1.1;
  margin:5px 0 8px;
}

h2{
  margin:0 0 8px;
}

.subtitle{
  color:var(--muted);
  font-size:15px;
  margin-bottom:20px;
}

.hero{
  padding:25px;
  border-radius:32px;
  background:linear-gradient(135deg,#fff,#edf5ff);
  box-shadow:var(--shadow);
  margin-bottom:15px;
}

.dark .hero{
  background:linear-gradient(135deg,#202023,#172338);
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-top:20px;
}

.stat{
  padding:13px;
  background:rgba(255,255,255,.7);
  border-radius:18px;
}

.dark .stat{
  background:rgba(255,255,255,.06);
}

.stat b{
  display:block;
  font-size:21px;
}

.stat span{
  font-size:12px;
  color:var(--muted);
}

.progress{
  height:8px;
  background:#e5e5ea;
  border-radius:20px;
  overflow:hidden;
  margin:12px 0 18px;
}

.progress-bar{
  height:100%;
  width:0;
  background:var(--blue);
  transition:.3s;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:26px;
  padding:21px;
  margin:14px 0;
  box-shadow:var(--shadow);
}

.primary{
  width:100%;
  padding:15px;
  border-radius:17px;
  background:var(--blue);
  color:white;
  font-weight:700;
}

.secondary{
  padding:12px 15px;
  border-radius:15px;
  background:#e9e9ee;
  color:var(--text);
  font-weight:650;
}

.dark .secondary{
  background:#2b2b2f;
}

.row{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
}

.row>*{
  flex:1;
}

.big-word{
  font-size:42px;
  font-weight:800;
  margin:8px 0;
}

.ipa{
  color:var(--blue);
  font-size:20px;
  margin-bottom:5px;
}

.meaning{
  font-size:19px;
  margin:8px 0;
}

.example{
  font-size:19px;
  line-height:1.5;
  margin:18px 0;
}

.pill{
  display:inline-block;
  padding:7px 10px;
  border-radius:12px;
  background:#edf5ff;
  color:#007aff;
  font-size:12px;
}

.dark .pill{
  background:#162d48;
}

.muted{
  color:var(--muted);
}

.small{
  font-size:13px;
}

.tabs{
  display:flex;
  gap:8px;
  overflow:auto;
  padding:3px 0 9px;
}

.tabs button{
  white-space:nowrap;
  padding:10px 14px;
  border-radius:14px;
  background:#e9e9ee;
}

.dark .tabs button{
  background:#29292d;
  color:white;
}

.tabs button.active{
  background:#111;
  color:white;
}

.choice{
  width:100%;
  text-align:left;
  padding:15px;
  margin:8px 0;
  border-radius:16px;
  background:#f0f0f5;
  color:var(--text);
}

.dark .choice{
  background:#29292d;
}

.choice.correct{
  background:#dff7e5;
}

.choice.wrong{
  background:#ffe1de;
}

.feedback{
  margin-top:12px;
  padding:14px;
  border-radius:16px;
  background:#f0f0f5;
  line-height:1.6;
}

.dark .feedback{
  background:#29292d;
}

.search{
  width:100%;
  padding:14px;
  border-radius:16px;
  border:1px solid var(--line);
  background:white;
  color:#111;
  outline:none;
}

.dark .search{
  background:#202023;
  color:white;
}

.bottom-nav{
  position:fixed;
  z-index:50;
  left:50%;
  bottom:12px;
  transform:translateX(-50%);
  width:min(700px,calc(100% - 24px));
  padding:7px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(20px);
  border:1px solid var(--line);
  border-radius:25px;
  box-shadow:0 12px 35px rgba(0,0,0,.14);
}

.dark .bottom-nav{
  background:rgba(30,30,32,.93);
}

.bottom-nav button{
  background:none;
  color:#777;
  padding:9px 3px;
  border-radius:18px;
  font-size:12px;
}

.bottom-nav button.active{
  background:#eeeef2;
  color:#111;
  font-weight:700;
}

.dark .bottom-nav button.active{
  background:#3a3a3c;
  color:white;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:25px;
}

@media(max-width:520px){
  .app{
    padding-left:13px;
    padding-right:13px;
  }

  h1{
    font-size:30px;
  }

  .big-word{
    font-size:36px;
  }
}
</style>
</head>

<body>

<header class="top">
  <div class="logo">Leon English Lab</div>
  <button class="icon-btn" onclick="toggleDark()" id="darkBtn">☾</button>
</header>


<!-- ================= 首页 ================= -->

<section id="home" class="page active">

</div>

</div>


<div class="card">

</p>

<button class="secondary" onclick="openChallenge()">
继续挑战 →
</button>

</div>


<div class="card">

<h2>🧠 错题复习</h2>

<p class="muted" id="mistakeInfo">
目前没有错题。
</p>

<button class="secondary" onclick="openMistakes()">
开始复习 →
</button>

</div>


<div class="card">

<h2>💬 今天聊聊</h2>

<p class="muted">
用简单英语说说你今天的生活。
</p>

<button class="secondary" onclick="openChat()">
开始 Daily Chat →
</button>

</div>

</section>


<!-- ================= 学习 ================= -->

<section id="learn" class="page">

<div class="subtitle">学习</div>

<h1>今天学一点</h1>

<div class="tabs">

<button class="active" onclick="changeLearnMode('word',this)">
单词
</button>

<button onclick="changeLearnMode('phrase',this)">
词组
</button>

<button onclick="changeLearnMode('sentence',this)">
短句
</button>

</div>

<div class="card" id="learnCard"></div>

</section>


<!-- ================= 练习 ================= -->

<section id="practice" class="page">

<div class="subtitle">Practice</div>

<h1>一题一题来</h1>

<div class="card" id="practiceCard"></div>

</section>


<!-- ================= 每日挑战 ================= -->

<section id="challenge" class="page">

<div class="subtitle">Daily Challenge</div>

<h1>每日挑战</h1>

<div class="card" id="challengeCard"></div>

</section>


<!-- ================= 我的 ================= -->

<section id="me" class="page">

<div class="subtitle">我的学习</div>

<h1>学习数据</h1>


<div class="card">

<h2>Level <span id="myLevel">1</span></h2>

<p>
<b id="myXP">0</b> XP
</p>

<div class="progress">
<div class="progress-bar" id="levelProgress"></div>
</div>

</div>


<div class="card">

<h2>学习统计</h2>

<p>已掌握单词：<b id="learnedCount">0</b></p>

<p>收藏：<b id="favoriteCount">0</b></p>

<p>错题：<b id="mistakeCount">0</b></p>

<p>累计答对：<b id="correctCount">0</b></p>

</div>


<div class="card">

<h2>🔎 查词</h2>

<input
class="search"
placeholder="搜索英文或中文"
oninput="searchDictionary(this.value)"
>

<div id="searchResult"></div>

</div>

</section>


<!-- ================= Daily Chat ================= -->

<section id="chat" class="page">

<div class="subtitle">Daily Chat</div>

<h1>今天聊聊</h1>

<div class="card">

<p class="muted">
不用写很长，一两句话就可以。
</p>

<h2 id="chatQuestion"></h2>

<p class="muted" id="chatHint"></p>

<button class="secondary"
onclick="speak(document.getElementById('chatQuestion').innerText)">
🔊 听问题
</button>

</div>

</section>

</div>


<!-- ================= 底部导航 ================= -->

<nav class="bottom-nav">

<button class="active" onclick="goPage('home',this)">
⌂<br>首页
</button>

<button onclick="goPage('learn',this)">
◉<br>学习
</button>

<button onclick="goPage('practice',this)">
✓<br>练习
</button>

<button onclick="goPage('me',this)">
●<br>我的
</button>

</nav>

/* ================= 状态 ================= */

let state=JSON.parse(localStorage.getItem("leon4_state")||"null")||{

xp:0,
streak:0,
correct:0,

learned:[],
favorites:[],
mistakes:[],

today:{
date:"",
done:0
},

challenge:{
date:"",
done:0
}

};


function save(){

localStorage.setItem(
"leon4_state",
JSON.stringify(state)
);

renderStats();

}


function getToday(){

return new Date()
.toISOString()
.slice(0,10);

}


function resetDaily(){

const d=getToday();

if(state.today.date!==d){

state.today={
date:d,
done:0
};

}

if(state.challenge.date!==d){

state.challenge={
date:d,
done:0
};

}

}


function addXP(amount){

resetDaily();

state.xp+=amount;

if(state.today.done<10){

state.today.done++;

}

if(state.streak===0){

state.streak=1;

}

save();

}


/* ================= 页面 ================= */

function goPage(id,button){

document
.querySelectorAll(".page")
.forEach(p=>p.classList.remove("active"));

document
.getElementById(id)
.classList.add("active");

document
.querySelectorAll(".bottom-nav button")
.forEach(b=>b.classList.remove("active"));

if(button){

button.classList.add("active");

}

if(id==="learn"){

renderLearn();

}

if(id==="practice"){

renderPractice();

}

if(id==="challenge"){

renderChallenge();

}

if(id==="chat"){

renderChat();

}

if(id==="me"){

renderStats();

}

window.scrollTo({
top:0,
behavior:"smooth"
});

}


function startLearning(){

goPage("learn");

}


function openChallenge(){

goPage("challenge");

}


function openMistakes(){

if(state.mistakes.length===0){

alert("目前没有错题，很棒！");

return;

}

goPage("practice");

practiceMode="mistakes";

practiceIndex=0;

renderPractice();

}


function openChat(){

goPage("chat");

}


/* ================= 深色模式 ================= */

function toggleDark(){

document.body.classList.toggle("dark");

localStorage.setItem(
"leon4_dark",
document.body.classList.contains("dark")
);

}


if(localStorage.getItem("leon4_dark")==="true"){

document.body.classList.add("dark");

}


/* ================= 学习 ================= */

let learnMode="word";

let learnIndex=0;


function changeLearnMode(mode,button){

learnMode=mode;

learnIndex=0;

document
.querySelectorAll(".tabs button")
.forEach(b=>b.classList.remove("active"));

button.classList.add("active");

renderLearn();

}

</div>

</div>

${w[2]}
</div>

</div>

<div class="row">

<button class="secondary"
onclick="speak('${safe(w[0])}')">
🔊 单词
</button>

<button class="secondary"
onclick="speak('${safe(w[3])}')">
🔊 例句
</button>

</div>

<div class="row" style="margin-top:10px">

<button class="secondary"
onclick="markLearned('${safe(w[0])}')">
✓ 认识
</button>

<button class="secondary"
onclick="favoriteWord('${safe(w[0])}')">
⭐ 收藏
</button>

</div>

<p class="muted small">
${learnIndex%WORDS.length+1} / ${WORDS.length}
</p>

<div class="row">

<button class="secondary"
onclick="previousLearn()">
← 上一个
</button>

<button class="secondary"
onclick="nextLearn()">
下一个 →
</button>

</div>

`;

}


else if(learnMode==="phrase"){

const p=PHRASES[
learnIndex%PHRASES.length
];

box.innerHTML=`

<span class="pill">词组</span>

<div class="big-word"
style="font-size:30px">
${p[0]}
</div>

<div class="meaning">
${p[1]}
</div>

<div class="example">
${p[2]}
</div>

<button class="secondary"
onclick="speak('${safe(p[2])}')">
🔊 播放
</button>

<p class="muted small">
${learnIndex%PHRASES.length+1} / ${PHRASES.length}
</p>

<div class="row">

<button class="secondary"
onclick="previousLearn()">
← 上一个
</button>

<button class="secondary"
onclick="nextLearn()">
下一个 →
</button>

</div>

`;

}


else{

const s=SENTENCES[
learnIndex%SENTENCES.length
];

box.innerHTML=`

<span class="pill">短句</span>

<div class="meaning">
${s[0]}
</div>

<div class="example">
${s[1]}
</div>

<button class="secondary"
onclick="speak('${safe(s[1])}')">
🔊 播放
</button>

<p class="muted small">
${learnIndex%SENTENCES.length+1} / ${SENTENCES.length}
</p>

<div class="row">

<button class="secondary"
onclick="previousLearn()">
← 上一个
</button>

<button class="secondary"
onclick="nextLearn()">
下一个 →
</button>

</div>

`;

}

}


function previousLearn(){

let total=
learnMode==="word"
?WORDS.length
:learnMode==="phrase"
?PHRASES.length
:SENTENCES.length;

learnIndex=
(learnIndex-1+total)%total;

renderLearn();

}


function nextLearn(){

let total=
learnMode==="word"
?WORDS.length
:learnMode==="phrase"
?PHRASES.length
:SENTENCES.length;

learnIndex=
(learnIndex+1)%total;

renderLearn();

}


function markLearned(word){

if(!state.learned.includes(word)){

state.learned.push(word);

addXP(10);

}

else{

save();

}

}


function favoriteWord(word){

if(state.favorites.includes(word)){

state.favorites=
state.favorites.filter(x=>x!==word);

}else{

state.favorites.push(word);

}

save();

}


function safe(text){

return text
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'");

}


/* ================= Practice ================= */

let practiceIndex=0;

let practiceMode="normal";

let practiceAnswered=false;


function renderPractice(){

const box=document.getElementById("practiceCard");

let q;

if(
practiceMode==="mistakes"
&&
state.mistakes.length
){

q=QUESTIONS.find(
x=>state.mistakes.includes(x[0])
);

if(!q){

practiceMode="normal";

}

}


if(!q){

q=QUESTIONS[
practiceIndex%QUESTIONS.length
];

}


practiceAnswered=false;

box.innerHTML=`

<span class="pill">
${practiceMode==="mistakes"?"错题复习":"Practice"}
</span>

<div class="challengeQ">
${q[0]}
</div>

<input
id="practiceAnswer"
class="search"
placeholder="输入你的答案"
>

<button
class="primary"
style="margin-top:12px"
onclick="checkPractice()">

检查答案

</button>

<div id="practiceFeedback"></div>

`;

}


function checkPractice(){

if(practiceAnswered)return;

practiceAnswered=true;

let q;

if(
practiceMode==="mistakes"
&&
state.mistakes.length
){

q=QUESTIONS.find(
x=>state.mistakes.includes(x[0])
);

}

if(!q){

q=QUESTIONS[
practiceIndex%QUESTIONS.length
];

}

const answer=
document
.getElementById("practiceAnswer")
.value
.trim()
.toLowerCase();

const correct=
answer===q[1].toLowerCase();

const feedback=
document.getElementById(
"practiceFeedback"
);


if(correct){

state.correct++;

state.mistakes=
state.mistakes.filter(
x=>x!==q[0]
);

feedback.innerHTML=`

<div class="feedback">

✅ Correct!

<br><br>

<b>${q[2]}</b>

<br>

很好，继续保持。

</div>

`;

addXP(10);

}else{

if(!state.mistakes.includes(q[0])){

state.mistakes.push(q[0]);

}

feedback.innerHTML=`

<div class="feedback">

❌ 还差一点。

<br><br>

正确答案：

<b>${q[1]}</b>

<br><br>

${q[2]}

</div>

`;

save();

}


feedback.innerHTML+=`

<button
class="secondary"
style="width:100%;margin-top:10px"
onclick="nextPractice()">

下一题 →

</button>

`;

}


function nextPractice(){

practiceIndex++;

renderPractice();

}


/* ================= Daily Challenge ================= */

function renderChallenge(){

resetDaily();

const box=
document.getElementById(
"challengeCard"
);


if(state.challenge.done>=5){

box.innerHTML=`

<h2>🎉 今天完成了！</h2>

<p class="muted">
5 / 5 challenges completed.
</p>

<div class="feedback">
今天的挑战全部完成。
<br>
明天继续。
</div>

`;

return;

}


const index=
state.challenge.done%5;


const questions=[

[
"I usually ___ coffee.",
"drink"
],

[
"After ___ home, I have dinner.",
"getting"
],

[
"I’m too tired ___ study tonight.",
"to"
],

[
"I focus on ___ English.",
"studying"
],

[
"Did you ___ English yesterday?",
"study"
]

];


const q=questions[index];


let options;

if(index===0){

options=[
"drink",
"drinking",
"drank"
];

}

else if(index===1){

options=[
"getting",
"get",
"got"
];

}

else if(index===2){

options=[
"to",
"for",
"with"
];

}

else if(index===3){

options=[
"studying",
"study",
"studied"
];

}

else{

options=[
"study",
"studying",
"studied"
];

}


options.sort(
()=>Math.random()-.5
);


box.innerHTML=`

<span class="pill">
Challenge ${index+1} / 5
</span>

<div class="challengeQ">
${q[0]}
</div>

${options.map(
x=>`

<button
class="choice"
onclick="answerChallenge(
this,
'${x}',
'${q[1]}'
)">

${x}

</button>

`
).join("")}

<div id="challengeFeedback"></div>

`;

}


function answerChallenge(
button,
answer,
correct
){

document
.querySelectorAll(".choice")
.forEach(
b=>b.disabled=true
);


const ok=
answer===correct;


button.classList.add(
ok?"correct":"wrong"
);


const feedback=
document.getElementById(
"challengeFeedback"
);


if(ok){

state.correct++;

state.challenge.done++;

feedback.innerHTML=`

<div class="feedback">

✅ Correct!

<br>
+10 XP

</div>

`;

addXP(10);

}else{

if(!state.mistakes.includes(answer)){

state.mistakes.push(answer);

}

feedback.innerHTML=`

<div class="feedback">

❌ 正确答案是：

<b>${correct}</b>

</div>

`;

save();

}


feedback.innerHTML+=`

<button
class="secondary"
style="width:100%;margin-top:10px"
onclick="renderChallenge()">

下一题 →

</button>

`;

}


/* ================= 搜索 ================= */

function searchDictionary(value){

const q=value
.trim()
.toLowerCase();

const box=
document.getElementById(
"searchResult"
);


if(!q){

box.innerHTML="";

return;

}


const result=
WORDS
.filter(
w=>w.join(" ")
.toLowerCase()
.includes(q)
)
.slice(0,8);


if(!result.length){

box.innerHTML=
`<div class="empty">
没有找到这个词。
</div>`;

return;

}


box.innerHTML=
result.map(
w=>`

<div class="card"
style="box-shadow:none">

<b>${w[0]}</b>

<div class="ipa">
${w[1]}
</div>

<div>
${w[2]}
</div>

<div class="muted">
${w[3]}
</div>

<button
class="secondary"
style="margin-top:8px"
onclick="speak('${safe(w[0])}')">

🔊

</button>

</div>

`
).join("");

}


/* ================= Daily Chat ================= */

function renderChat(){

const item=
CHAT[
new Date().getDate()
%CHAT.length
];


document
.getElementById("chatQuestion")
.textContent=item[0];


document
.getElementById("chatHint")
.textContent=item[1];

}


/* ================= 统计 ================= */

function renderStats(){

resetDaily();

const level=
Math.floor(state.xp/500)+1;

document
.getElementById("level")
.textContent=level;

document
.getElementById("myLevel")
.textContent=level;

document
.getElementById("xp")
.textContent=state.xp;

document
.getElementById("myXP")
.textContent=state.xp;

document
.getElementById("streak")
.textContent=state.streak;

document
.getElementById("todayCount")
.textContent=
state.today.done+" / 10";


document
.getElementById("todayProgress")
.style.width=
Math.min(
100,
state.today.done*10
)+"%";


document
.getElementById("levelProgress")
.style.width=
(state.xp%500)/5+"%";


document
.getElementById("learnedCount")
.textContent=
state.learned.length;


document
.getElementById("favoriteCount")
.textContent=
state.favorites.length;


document
.getElementById("mistakeCount")
.textContent=
state.mistakes.length;


document
.getElementById("correctCount")
.textContent=
state.correct;


document
.getElementById("mistakeInfo")
.textContent=
state.mistakes.length
?
"今天建议复习 "+state.mistakes.length+" 题。"
:
"目前没有错题，很棒！";

}


/* ================= 语音 ================= */

function speak(text){

if(!("speechSynthesis"in window)){

alert("你的浏览器不支持语音播放。");

return;

}

speechSynthesis.cancel();

const u=
new SpeechSynthesisUtterance(text);

u.lang="en-US";

u.rate=.9;

speechSynthesis.speak(u);

}


/* ================= 初始化 ================= */

resetDaily();

renderStats();

renderLearn();

renderChallenge();

renderChat();

</script>
